<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebGPU glTF Viewer</title>
    <style>
        body { margin: 0; background: #1a1a2e; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        #controls { margin-bottom: 10px; }
        #controls label { color: #ccc; font-family: sans-serif; font-size: 14px; margin-right: 8px; }
        #glb-upload { color: #ccc; font-family: sans-serif; font-size: 14px; }
        canvas { border: 1px solid #333; }
    </style>
</head>
<body>
    <div id="controls">
        <label for="glb-upload">Load GLB:</label>
        <input type="file" id="glb-upload" accept=".glb">
    </div>
    <canvas id="webgpu-canvas" width="800" height="600"></canvas>
    <script type="module" src="main.js"></script>
</body>
</html>
